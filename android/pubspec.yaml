name: twink_android
description: "Twink: German vocabulary, spaced repetition and exams."
publish_to: 'none'
version: 0.3.18+27

environment:
  sdk: ^3.13.2

dependencies:
  audioplayers: ^6.8.1
  crypto: ^3.0.8
  excel: ^4.0.6
  file_picker: ^13.3.1
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_tts: ^4.2.5
  http: ^1.6.0
  path_provider: ^2.1.6
  speech_to_text: ^7.5.0
  flutter_svg: ^2.3.2
  html: ^0.15.7
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/icons/
    - assets/word-images/
    - assets/word-images/images/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto-regular.ttf
        - asset: assets/fonts/roboto-medium.ttf
          weight: 500
        - asset: assets/fonts/roboto-bold.ttf
          weight: 700
        - asset: assets/fonts/roboto-black.ttf
          weight: 900
        - asset: assets/fonts/roboto-italic.ttf
          style: italic

    - family: Outfit
      fonts:
        - asset: assets/fonts/outfit-variable.ttf
          weight: 100
        - asset: assets/fonts/outfit-variable.ttf
          weight: 200
        - asset: assets/fonts/outfit-variable.ttf
          weight: 300
        - asset: assets/fonts/outfit-variable.ttf
          weight: 400
        - asset: assets/fonts/outfit-variable.ttf
          weight: 500
        - asset: assets/fonts/outfit-variable.ttf
          weight: 600
        - asset: assets/fonts/outfit-variable.ttf
          weight: 700
        - asset: assets/fonts/outfit-variable.ttf
          weight: 800
        - asset: assets/fonts/outfit-variable.ttf
          weight: 900
