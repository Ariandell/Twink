name: twink_android
description: "Twink: German vocabulary, spaced repetition and exams."
publish_to: 'none'
version: 0.2.2+4

environment:
  sdk: ^3.13.2

dependencies:
  audioplayers: ^6.8.1
  crypto: ^3.0.8
  excel: ^4.0.6
  file_picker: ^13.3.1
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_tts: ^4.2.5
  http: ^1.6.0
  path_provider: ^2.1.6
  speech_to_text: ^7.5.0
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/classic/
    - assets/classic/vendor/
