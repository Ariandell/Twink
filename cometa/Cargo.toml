[package]
name = "twink-cometa"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "cometa"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "cometa-preview"
path = "src/main.rs"

[dependencies]
skia-safe = { version = "=0.157.0", features = ["gl", "textlayout"] }
winit = { version = "0.30", features = ["android-native-activity"] }
glutin = "0.32"
glutin-winit = "0.5"
gl = "0.14"
raw-window-handle = "0.6"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
